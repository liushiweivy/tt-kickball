<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=450, initial-scale=1, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23d8a74a'/%3E%3C/svg%3E">
<title>闪身步 · harness</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070f; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  #frame { width: 450px; height: 800px; box-shadow: 0 0 40px rgba(0,0,0,.8); }
  canvas { display: block; width: 450px; height: 800px; touch-action: none; }
  /* ---- 修改器面板 ---- */
  #dbg-toggle { position: fixed; top: 10px; right: 10px; z-index: 20; width: 40px; height: 40px;
    border-radius: 50%; border: 1px solid #d8a74a; background: rgba(10,14,31,.85); color: #d8a74a;
    font-size: 20px; cursor: pointer; }
  #dbg { position: fixed; top: 58px; right: 10px; z-index: 20; width: 250px; padding: 10px 12px;
    border: 1px solid #d8a74a; border-radius: 8px; background: rgba(10,14,31,.92); color: #e8ecf8;
    font: 12px/1.6 sans-serif; display: none; max-height: 82vh; overflow-y: auto; }
  #dbg.open { display: block; }
  #dbg h3 { margin: 0 0 6px; font-size: 13px; color: #d8a74a; letter-spacing: 2px; }
  #dbg label { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin: 3px 0; }
  #dbg input { width: 76px; background: #10162e; color: #e8ecf8; border: 1px solid #3a4468;
    border-radius: 4px; padding: 2px 5px; font: 12px sans-serif; }
  #dbg .row { display: flex; gap: 6px; margin-top: 8px; }
  #dbg button { flex: 1; background: #d8a74a; color: #10162e; border: 0; border-radius: 4px;
    padding: 4px 0; font: 600 12px sans-serif; cursor: pointer; }
  #dbg button.ghost { background: transparent; border: 1px solid #3a4468; color: #aeb8da; }
  #dbg .tip { margin-top: 6px; color: #7c86a8; font-size: 11px; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="game" width="450" height="800"></canvas>
</div>
<button id="dbg-toggle" title="修改器">⚙</button>
<div id="dbg">
  <h3>修 改 器</h3>
  <div id="dbg-fields"></div>
  <div class="row">
    <button id="dbg-apply">保存并重开</button>
    <button id="dbg-reset" class="ghost">恢复默认</button>
  </div>
  <div class="tip">判定类即时生效；血量/波次类点「保存并重开」生效。配置存 localStorage。</div>
</div>
<script>
/* ---- 极简 CommonJS 加载器（同步 XHR） ---- */
const modules = {};
function resolve(p, fromDir) {
  const base = (fromDir || '').split('/').slice(0, -1);
  p.split('/').forEach(seg => {
    if (seg === '..') base.pop();
    else if (seg !== '.' && seg !== '') base.push(seg);
  });
  return base.join('/');
}
function load(path, fromDir) {
  const full = resolve(path, fromDir || '');
  if (modules[full]) return modules[full].exports;
  const m = { exports: {} };
  modules[full] = m;
  const xhr = new XMLHttpRequest();
  xhr.open('GET', '/' + full, false);
  xhr.send();
  if (xhr.status !== 200) throw new Error('load fail ' + full + ' ' + xhr.status);
  const fn = new Function('module', 'exports', 'require', '__dirname', xhr.responseText);
  const localRequire = p => load(p, full);
  fn(m, m.exports, localRequire, full.split('/').slice(0, -1).join('/'));
  return m.exports;
}

/* ---- tt（抖音小游戏）浏览器 shim ---- */
// ?sound=1  有声模式（用真实浏览器 AudioContext 跑通 W3C 音频路径）
// ?strict=1 严格抖音契约：Touch 只给 identifier/screenX/screenY
const Q = new URLSearchParams(location.search);
const SOUND = Q.get('sound') === '1';
const STRICT = Q.get('strict') === '1';
const canvas = document.getElementById('game');
const rectOf = () => canvas.getBoundingClientRect();
function touchLike(e, id) {
  const r = rectOf();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const t = { identifier: id != null ? id : 0, screenX: x, screenY: y };
  if (!STRICT) { t.clientX = x; t.clientY = y; } // 真机抖音只保证 screenX/screenY
  return t;
}
const startH = [], endH = [], cancelH = [], showH = [], hideH = [];
globalThis.tt = {
  getSystemInfoSync: () => ({ windowWidth: 450, windowHeight: 800, pixelRatio: 1 }),
  createCanvas: () => canvas,
  // 敌人皮肤位图：真机包里 src="assets/.." 相对包根；harness 页面在 /harness/ 下，
  // 浏览器会解析成 /harness/assets/..（404），这里把包路径重写到项目根
  createImage: () => {
    const img = new Image();
    Object.defineProperty(img, "src", {
      set(v) { this.setAttribute("src", "/" + String(v).replace(/^\/+/, "")); },
      get() { return this.getAttribute("src"); },
      configurable: true,
    });
    return img;
  },
  onTouchStart: h => startH.push(h),
  onTouchEnd: h => endH.push(h),
  onTouchCancel: h => cancelH.push(h),
  onShow: h => showH.push(h),
  onHide: h => hideH.push(h),
  // 默认静音（自动化连推数千帧避免 WebAudio 排队）；?sound=1 走真实音频
  getAudioContext: () => {
    if (!SOUND) throw new Error("muted in harness");
    return new AudioContext();
  },
  // 选关进度存档：浏览器用 localStorage 兜底 tt 本地缓存
  getStorageSync: k => {
    const v = localStorage.getItem(k);
    return v == null ? "" : v;
  },
  setStorageSync: (k, v) => localStorage.setItem(k, String(v)),
  // 测试钩子：tt._life.show()/hide() 手动触发生命周期
  _life: {
    show: () => showH.forEach(h => h()),
    hide: () => hideH.forEach(h => h()),
  },
};
function dispatch(list, ev) { list.forEach(h => h(ev)); }
canvas.addEventListener('mousedown', e => { e.preventDefault(); dispatch(startH, { changedTouches: [touchLike(e)] }); });
window.addEventListener('mouseup', e => dispatch(endH, { changedTouches: [touchLike(e)] }));
canvas.addEventListener('touchstart', e => { e.preventDefault(); dispatch(startH, { changedTouches: [].map.call(e.changedTouches, t => touchLike(t, t.identifier)) }); }, { passive: false });
window.addEventListener('touchend', e => dispatch(endH, { changedTouches: [].map.call(e.changedTouches, t => touchLike(t, t.identifier)) }));

/* ---- 启动小游戏 ---- */
load('js/main.js');

/* ---- 修改器：直改内核 CFG，localStorage 持久化 ---- */
(function () {
  const KB = globalThis.__kickball;
  if (!KB) return;
  const CFG = KB.CFG;
  const STORE_KEY = 'kickball-debug-v1';
  // 默认快照（首次打开时内核出厂值），恢复默认用
  const FIELDS = [
    ['DASH_PERFECT_PX', '完美闪身距离(px)'],
    ['COMBO_KICK_WINDOW', '踢连击窗口(s)'],
    ['COMBO_NEED', '大招连击数'],
    ['KICK_PERFECT', '完美踢窗(s)'],
    ['MAX_HP', '玩家血量'],
    ['KICK_HP', '完美踢伤害'],
    ['E_HP', '被白球命中伤'],
    ['PERIL_HP', '被危球命中伤'],
    ['BALL_SPEED_MUL', '球速倍率'],
    ['FLAIL_TIME', '大招时长(s)'],
    ['FLAIL_KICK_HP', '大招弹回伤害'],
    ['PEBBLE_CD', '飞蝗石冷却(s)'],
    ['PEBBLE_HP', '飞蝗石伤害'],
  ];
  const defaults = {};
  FIELDS.forEach(([k]) => { defaults[k] = CFG[k]; });

  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) { /* 坏数据当没有 */ }
  FIELDS.forEach(([k]) => { if (typeof saved[k] === 'number') CFG[k] = saved[k]; });

  const box = document.getElementById('dbg-fields');
  FIELDS.forEach(([k, label]) => {
    const row = document.createElement('label');
    row.innerHTML = '<span>' + label + '</span>';
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.step = k.includes('WINDOW') || k.includes('PERFECT') || k.includes('MUL') || k.includes('TIME') ? '0.01' : '1';
    inp.value = CFG[k];
    inp.dataset.key = k;
    row.appendChild(inp);
    box.appendChild(row);
  });

  document.getElementById('dbg-toggle').onclick = () =>
    document.getElementById('dbg').classList.toggle('open');

  document.getElementById('dbg-apply').onclick = () => {
    const out = {};
    box.querySelectorAll('input').forEach((inp) => {
      const v = Number(inp.value);
      if (Number.isFinite(v)) { CFG[inp.dataset.key] = v; out[inp.dataset.key] = v; }
    });
    localStorage.setItem(STORE_KEY, JSON.stringify(out));
    KB.game.start(); // 血量/波次类重开生效
  };

  document.getElementById('dbg-reset').onclick = () => {
    FIELDS.forEach(([k]) => { CFG[k] = defaults[k]; });
    localStorage.removeItem(STORE_KEY);
    box.querySelectorAll('input').forEach((inp) => { inp.value = defaults[inp.dataset.key]; });
    KB.game.start();
  };
})();
</script>
</body>
</html>
